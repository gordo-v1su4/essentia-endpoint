name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          BASE_VERSION=$(grep 'API_VERSION = "' main.py | sed 's/.*"\([^"]*\)".*/\1/' || echo "4.0.2")
          BUILD_VERSION="${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION"
          echo "Build version: $BUILD_VERSION"
          echo "SHA tag: $SHA_TAG"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gordov1su4/essentia-api:${{ steps.version.outputs.base_version }}
            gordov1su4/essentia-api:${{ steps.version.outputs.build_version }}
            gordov1su4/essentia-api:${{ steps.version.outputs.sha_tag }}
            gordov1su4/essentia-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
