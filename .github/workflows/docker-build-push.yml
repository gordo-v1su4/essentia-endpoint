name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'API_VERSION = "' main.py | sed 's/.*"\([^"]*\)".*/\1/' || echo "3.0.2")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gordov1su4/essentia-api:${{ steps.version.outputs.version }}
            gordov1su4/essentia-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-coolify:
    needs: build-and-push
    # Set ENABLE_COOLIFY_DEPLOY=true in Settings → Secrets and variables → Actions → Variables
    if: vars.ENABLE_COOLIFY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
