# Production compose for VM100 app-vm (4090). Copy to /opt/essentia-endpoint/docker-compose.yml
services:
  api:
    image: ${ESSENTIA_IMAGE:-gordov1su4/essentia-api:4.1.0}
    pull_policy: always
    container_name: essentia-api
    restart: unless-stopped
    labels:
      dockhand.update: "false"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ESSENTIA_MODELS_PATH: /app/models
      ALLIN1_DEVICE: ${ALLIN1_DEVICE:-cuda}
      STUDIO_JOBS_DIR: /app/studio-jobs
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "18000:8000"
    gpus: all
    volumes:
      - essentia-models:/app/models
      - essentia-studio-jobs:/app/studio-jobs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
volumes:
  essentia-models:
  essentia-studio-jobs:
