services:
  essentia-api:
    # Production/Coolify: pull prebuilt image from registry (no server-side build).
    image: ${ESSENTIA_IMAGE:-gordov1su4/essentia-api:4.0.0}
    container_name: essentia-audio-api
    ports:
      # Map to port 7000 for local dev, Coolify will use its own reverse proxy for 80/443
      - "${EXTERNAL_PORT:-7000}:8000"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - API_KEYS=${API_KEYS}
      - ESSENTIA_MODELS_PATH=/app/models
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - TF_CPP_MIN_LOG_LEVEL=3
    volumes:
      # Persistent storage for Essentia models. 
      # In Coolify, ensure this path has proper write permissions or use a named volume.
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Resource limits. Runs on CPU by default. Add GPU via Coolify if you have NVIDIA Container Toolkit.
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 1G
