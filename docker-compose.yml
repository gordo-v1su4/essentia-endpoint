services:
  api:
    build:
      context: https://github.com/gordo-v1su4/essentia-endpoint.git#main
    container_name: essentia-api
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=https://essentia.v1su4.dev
      - API_KEYS=${API_KEYS}  # We'll set this in Portainer UI
      - ESSENTIA_MODELS_PATH=/app/models
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TONAL_CREPE_MODEL=${TONAL_CREPE_MODEL:-auto}
      - TONAL_PITCH_MAX_SECONDS=${TONAL_PITCH_MAX_SECONDS:-45}
      - TONAL_TEMPO_MAX_SECONDS=${TONAL_TEMPO_MAX_SECONDS:-120}
    ports:
      - "8000:8000"
    gpus: all
    runtime: nvidia
    volumes:
      - essentia-models:/app/models
    networks:
      - essentia-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.essentia.rule=Host(`essentia.v1su4.dev`)"
      - "traefik.http.routers.essentia.entrypoints=websecure"
      - "traefik.http.routers.essentia.tls.certresolver=letsencrypt"
      - "traefik.http.services.essentia.loadbalancer.server.port=8000"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.essentia-http.rule=Host(`essentia.v1su4.dev`)"
      - "traefik.http.routers.essentia-http.entrypoints=web"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.essentia-http.middlewares=https-redirect"

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=your-email@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - essentia-network

networks:
  essentia-network:
    driver: bridge

volumes:
  essentia-models:
  traefik-certs:
